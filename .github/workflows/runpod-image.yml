name: Build Runpod Serverless image
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [studio/cuda128/**, .github/workflows/runpod-image.yml]
permissions:
  contents: read
  packages: write
concurrency:
  group: runpod-image-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Free hosted runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Check graphs and resumable downloads
        run: |
          python -m pip install requests filelock
          python -m unittest discover -s tests -p 'test_runpod_graph.py'
          python -m unittest discover -s tests -p 'test_runpod_downloads.py'
          python -m unittest discover -s tests -p 'test_runpod_global.py'
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ofm-studio-runpod" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: studio/cuda128
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image link
        run: |
          echo '### Runpod image' >> "$GITHUB_STEP_SUMMARY"
          echo "\`$IMAGE:${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo 'Use the commit tag in your Runpod endpoint. Set GHCR package visibility to public.' >> "$GITHUB_STEP_SUMMARY"
